# Configuracao do Nginx para o projeto Clinica
# Reverse proxy com rate limiting e headers de seguranca

events {
    worker_connections 1024;
}

http {
    # Incluir configuracao de MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuracoes de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compressao gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream para a aplicacao Next.js
    upstream nextjs {
        server app:3000;
    }

    # Limites de taxa (rate limiting)
    # Zona para requisicoes gerais
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Zona para autenticacao (mais restritiva)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Zona para pagamentos
    limit_req_zone $binary_remote_addr zone=payments:10m rate=2r/s;

    # Configuracao do servidor HTTP (redireciona para HTTPS)
    server {
        listen 80;
        server_name _;
        
        # Para desenvolvimento local, serve diretamente
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Rota de autenticacao com rate limiting mais restritivo
        location /api/auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota de pagamentos com rate limiting
        location /api/pagamentos {
            limit_req zone=payments burst=3 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache de assets estaticos
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache de imagens publicas
        location /public {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Headers de seguranca
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Bloquear acesso a arquivos ocultos
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
