version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: clinica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica123
      POSTGRES_DB: clinica_pwa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica_pwa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
